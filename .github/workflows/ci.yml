name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install -r scripts/requirements-ci.txt
          python scripts/install-tools.py stylua actionlint gitleaks
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0
      - name: Run all checks
        run: python scripts/checks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-security
          path: reports/
          retention-days: 30
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Neovim
        run: python scripts/install-tools.py nvim
      - name: Run Neovim integration and process E2E
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/test.py 2>&1 | tee reports/e2e.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: reports/
          retention-days: 30
  gate:
    name: CI required
    if: always()
    needs: [quality, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          printf '| Quality/security | E2E |\n|---|---|\n| %s | %s |\n' "$QUALITY" "$E2E" >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY" = success && test "$E2E" = success
  publish:
    name: Report and daily pre-release
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: develop-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Maintain PR, report and daily release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.gate.result }}
        run: python3 scripts/publish.py
