name: Stable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    if: github.actor == 'themakunga' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs" \
            --jq 'any(.check_runs[]; .name == "CI required" and .app.slug == "github-actions" and .conclusion == "success")' \
            | grep -qx true
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --latest
