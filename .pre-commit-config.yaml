exclude: ^tests/fixtures/
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: stylua
        name: Lua formatting
        entry: python3 scripts/hook.py stylua --check
        language: system
        types: [lua]
      - id: luacheck
        name: Lua static analysis
        entry: python3 scripts/hook.py luacheck
        language: system
        types: [lua]
      - id: gitleaks
        name: Secrets (staged changes)
        entry: python3 scripts/hook.py gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: actionlint
        name: Workflow correctness
        entry: python3 scripts/hook.py actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: zizmor
        name: Workflow security
        entry: python3 scripts/hook.py zizmor --offline --min-severity low .github/workflows
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: semgrep
        name: Lua security patterns
        entry: python3 scripts/hook.py semgrep scan --config .github/security/lua.yml --error --disable-version-check lua
        language: system
        types: [lua]
        pass_filenames: false
      - id: tests
        name: Neovim integration and E2E
        entry: python3 scripts/hook.py python3 scripts/test.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
